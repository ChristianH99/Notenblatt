name: CI

# Checks every push to main and every pull request. No installer is built here;
# installers are only built for GitHub releases (see release.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Third-party notices up to date
        run: npm run licenses:check

      - name: Unit and integration tests
        run: npm test

      - name: Coverage of src/shared (≥ 95 %)
        run: npm run coverage

      - name: End-to-end tests (Playwright + Electron)
        run: npm run e2e

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test-results/screenshots/*.png
          if-no-files-found: ignore
