name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Coverage of src/shared (≥ 95 %)
        run: npm run coverage

      - name: End-to-end tests (Playwright + Electron)
        run: npm run e2e

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore

      - name: Build installers (x64, arm64)
        run: npm run dist:win

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Notenblatt-Setup
          path: |
            dist/Notenblatt-Setup-*-x64.exe
            dist/Notenblatt-Setup-*-arm64.exe
          if-no-files-found: error
